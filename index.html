<div class="text-center mt-8">
    <button onclick="completeLesson()" class="bg-emerald-600 text-white px-6 py-3 rounded-full font-bold hover:bg-emerald-700 transition">
        ✅ Mark Lesson as Complete & Return to Dashboard
    </button>
</div>

<script>
    function completeLesson() {
        // Save completion to localStorage
        let lessonAccess = JSON.parse(localStorage.getItem('lessonAccess')) || {};
        if (lessonAccess.lesson3) {
            lessonAccess.lesson3.completed = true;
            // Auto-unlock lesson 4
            const lessons = ['lesson2','lesson3','lesson4','lesson5','lesson6','lesson7','lesson8'];
            const idx = lessons.indexOf('lesson3');
            if (idx < lessons.length - 1) {
                const next = lessons[idx+1];
                if (lessonAccess[next]) lessonAccess[next].unlocked = true;
                else lessonAccess[next] = { unlocked: true, completed: false };
            }
            localStorage.setItem('lessonAccess', JSON.stringify(lessonAccess));
        }
        // Go back to index and trigger refresh
        window.location.href = 'index.html?complete=lesson3';
    }
</script>
