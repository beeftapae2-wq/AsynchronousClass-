<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purposive Communication | Asynchronous Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Open Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Nunito', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #fbbf24 100%); }
        .module-card { transition: all 0.3s ease; border: 2px solid transparent; }
        .module-card.locked { background: #f8fafc; filter: grayscale(0.1); opacity: 0.85; cursor: default; }
        .module-card.unlocked { cursor: pointer; }
        .module-card.unlocked:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -6px rgba(99,102,241,0.2); }
        .team-card { transition: all 0.3s ease; }
        .team-card:hover { transform: translateY(-5px); box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<script>
    // ============ AUTHENTICATION CHECK ============
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    const userRole = localStorage.getItem('userRole');
    const userName = localStorage.getItem('userName');
    
    if (!isLoggedIn || !userName) {
        window.location.href = 'login.html';
    }
    
    const isTeacher = (userRole === 'teacher');

    // ============ LESSON CONFIG ============
    const lessonConfig = [
        {
            id: 'lesson2',
            label: 'Lesson 2',
            title: 'Public Speaking & Speech Delivery',
            desc: 'Techniques for effective oral presentations and speech preparation.',
            icon: 'mic',
            gradient: 'from-indigo-400 to-purple-500',
            link: 'week2.html',
            defaultUnlocked: true
        },
        {
            id: 'lesson3',
            label: 'Lesson 3',
            title: 'Making Inquiries',
            desc: 'Letters, emails, and interviews — asking for information professionally.',
            icon: 'help-circle',
            gradient: 'from-emerald-400 to-teal-500',
            link: 'week3.html',
            defaultUnlocked: false
        },
        {
            id: 'lesson4',
            label: 'Lesson 4',
            title: 'Communication for Teachers: Storytelling',
            desc: 'Using narratives to engage, educate, and inspire learners.',
            icon: 'book-open',
            gradient: 'from-blue-400 to-cyan-500',
            link: 'lesson4.html',
            defaultUnlocked: false
        },
        {
            id: 'lesson5',
            label: 'Lesson 5',
            title: 'Communication for Business and Trade',
            desc: 'Professional correspondence, negotiations, and workplace communication.',
            icon: 'briefcase',
            gradient: 'from-violet-400 to-purple-500',
            link: 'lesson5.html',
            defaultUnlocked: false
        },
        {
            id: 'lesson6',
            label: 'Lesson 6',
            title: 'Writing Business and Technical Report',
            desc: 'Structures, formats, and effective reporting techniques.',
            icon: 'file-text',
            gradient: 'from-sky-400 to-blue-500',
            link: 'lesson6.html',
            defaultUnlocked: false
        },
        {
            id: 'lesson7',
            label: 'Lesson 7',
            title: 'Communication for Employment: The Resume',
            desc: 'Crafting effective resumes and cover letters for job applications.',
            icon: 'file-user',
            gradient: 'from-amber-400 to-orange-500',
            link: 'lesson7.html',
            defaultUnlocked: false
        },
        {
            id: 'lesson8',
            label: 'Lesson 8',
            title: 'Communication for Employment',
            desc: 'Interview skills, professional branding, and workplace readiness.',
            icon: 'users',
            gradient: 'from-rose-400 to-red-500',
            link: 'lesson8.html',
            defaultUnlocked: false
        }
    ];

    // ============ LESSON ACCESS (localStorage) ============
    let lessonAccess = JSON.parse(localStorage.getItem('lessonAccess')) || {};

    function initLessonAccess() {
        lessonConfig.forEach(cfg => {
            if (!lessonAccess[cfg.id]) {
                lessonAccess[cfg.id] = {
                    unlocked: cfg.defaultUnlocked,
                    completed: false,
                    link: cfg.link
                };
            }
        });
        localStorage.setItem('lessonAccess', JSON.stringify(lessonAccess));
    }
    initLessonAccess();

    function saveLessonAccess() {
        localStorage.setItem('lessonAccess', JSON.stringify(lessonAccess));
        renderModules();
        lucide.createIcons();
    }

    // ============ TEACHER CONTROLS ============
    function toggleLesson(lessonId) {
        if (!isTeacher) return;
        lessonAccess[lessonId].unlocked = !lessonAccess[lessonId].unlocked;
        saveLessonAccess();
    }

    function unlockAllLessons() {
        if (!isTeacher) return;
        for (let key in lessonAccess) lessonAccess[key].unlocked = true;
        saveLessonAccess();
    }

    function lockAllLessons() {
        if (!isTeacher) return;
        for (let key in lessonAccess) {
            if (key !== 'lesson2') lessonAccess[key].unlocked = false;
        }
        saveLessonAccess();
    }

    // ============ MARK COMPLETED & AUTO-UNLOCK NEXT ============
    function markCompleted(lessonId) {
        if (lessonAccess[lessonId].completed) return;
        lessonAccess[lessonId].completed = true;
        
        const lessons = lessonConfig.map(l => l.id);
        const idx = lessons.indexOf(lessonId);
        if (idx < lessons.length - 1) {
            const nextId = lessons[idx + 1];
            if (!lessonAccess[nextId].unlocked) {
                lessonAccess[nextId].unlocked = true;
            }
        }
        saveLessonAccess();
        alert(`✅ Completed "${lessonConfig.find(l => l.id === lessonId).title}"! Next lesson unlocked.`);
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // ============ RENDER MODULES ============
    function renderModules() {
        const grid = document.getElementById('modulesGrid');
        if (!grid) return;

        grid.innerHTML = lessonConfig.map(cfg => {
            const access = lessonAccess[cfg.id];
            const unlocked = access.unlocked;
            const completed = access.completed;
            
            if (unlocked) {
                return `
                <div class="relative">
                    <a href="${cfg.link}" class="module-card unlocked bg-white rounded-xl shadow-md overflow-hidden block">
                        <div class="h-24 bg-gradient-to-r ${cfg.gradient} flex items-center justify-between px-6">
                            <span class="text-white font-bold text-lg">${cfg.label}</span>
                            <i data-lucide="external-link" class="w-5 h-5 text-white"></i>
                        </div>
                        <div class="p-6 pb-4">
                            <h3 class="text-xl font-bold mb-2 flex items-center">
                                <i data-lucide="${cfg.icon}" class="w-5 h-5 text-indigo-500 mr-2 flex-shrink-0"></i>
                                ${cfg.title}
                            </h3>
                            <p class="text-slate-600 text-sm mb-3">${cfg.desc}</p>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-green-600 font-semibold">🔓 Open</span>
                                ${completed ? '<span class="bg-green-100 text-green-600 px-2 py-1 rounded-full text-xs">✓ Completed</span>' : '<span class="bg-blue-100 text-blue-600 px-2 py-1 rounded-full text-xs">Click to start</span>'}
                            </div>
                        </div>
                    </a>
                    ${isTeacher ? `
                    <div class="px-6 pb-4 bg-white rounded-b-xl -mt-1">
                        <button onclick="event.stopPropagation(); toggleLesson('${cfg.id}')" class="w-full text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-100 transition font-semibold flex items-center justify-center gap-1">
                            <i data-lucide="lock" class="w-3 h-3"></i> Lock this lesson
                        </button>
                    </div>` : ''}
                </div>`;
            } else {
                return `
                <div class="module-card locked bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="h-24 bg-gradient-to-r from-slate-400 to-gray-500 flex items-center justify-between px-6">
                        <span class="text-white font-bold text-lg">${cfg.label}</span>
                        <i data-lucide="lock" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="p-6 pb-4">
                        <h3 class="text-xl font-bold mb-2 flex items-center">
                            <i data-lucide="${cfg.icon}" class="w-5 h-5 text-slate-500 mr-2 flex-shrink-0"></i>
                            ${cfg.title}
                        </h3>
                        <p class="text-slate-600 text-sm mb-3">${cfg.desc}</p>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-400 font-semibold">🔒 Locked</span>
                            <span class="bg-slate-200 text-slate-500 px-2 py-1 rounded-full text-xs">Complete previous lesson</span>
                        </div>
                    </div>
                    ${isTeacher ? `
                    <div class="px-6 pb-4">
                        <button onclick="toggleLesson('${cfg.id}')" class="w-full text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg hover:bg-amber-100 transition font-semibold flex items-center justify-center gap-1">
                            <i data-lucide="unlock" class="w-3 h-3"></i> Unlock this lesson
                        </button>
                    </div>` : ''}
                </div>`;
            }
        }).join('');
        lucide.createIcons();
    }

    // Cross-tab sync
    window.addEventListener('storage', (event) => {
        if (event.key === 'lessonAccess') {
            lessonAccess = JSON.parse(event.newValue) || lessonAccess;
            renderModules();
        }
    });

    // Check if returning from a lesson with completion flag
    function checkCompletionParam() {
        const urlParams = new URLSearchParams(window.location.search);
        const completeId = urlParams.get('complete');
        if (completeId) {
            markCompleted(completeId);
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkCompletionParam();
        renderModules();
        document.getElementById('navUserLabel').textContent = isTeacher ? '👩‍🏫 Teacher: ' + userName : '👨‍🎓 Student: ' + userName;
        document.getElementById('heroWelcome').textContent = `Welcome, ${userName}! Click a module below to begin.`;
        if (isTeacher) document.getElementById('teacherControls').style.display = 'block';
    });
</script>

<!-- Navigation -->
<nav class="gradient-bg text-white sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center space-x-2 font-bold text-xl">
                <i data-lucide="message-square" class="w-8 h-8"></i>
                <span>Purposive Comm</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm bg-white/20 px-3 py-1 rounded-full" id="navUserLabel"></span>
                <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </div>
    </div>
</nav>

<header class="gradient-bg text-white py-12">
    <div class="container mx-auto px-4 text-center">
        <div class="inline-block p-3 bg-white/20 rounded-full mb-4">
            <i data-lucide="message-square" class="w-12 h-12"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold mb-4">Asynchronous Class</h1>
        <h2 class="text-2xl md:text-3xl font-bold mb-4">Purposive Communication</h2>
        <p class="text-lg max-w-2xl mx-auto opacity-90" id="heroWelcome"></p>
    </div>
</header>

<div id="teacherControls" style="display: none;" class="container mx-auto px-4 py-4">
    <div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-4">
        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-2">
                <i data-lucide="settings" class="w-5 h-5 text-amber-700"></i>
                <span class="font-bold text-amber-800">Teacher Controls:</span>
            </div>
            <div class="flex gap-2">
                <button onclick="unlockAllLessons()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">🔓 Unlock All</button>
                <button onclick="lockAllLessons()" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">🔒 Lock All (Keep L2)</button>
            </div>
        </div>
    </div>
</div>

<section class="py-12 bg-slate-100">
    <div class="container mx-auto px-4">
        <h2 class="text-2xl md:text-3xl font-bold text-center mb-4 text-indigo-600">📘 Course Modules</h2>
        <div id="modulesGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto"></div>
        <p class="text-center text-slate-500 mt-6 text-sm">✅ After finishing a lesson, click "Mark as Complete" inside that lesson page.</p>
    </div>
</section>

<footer class="bg-slate-800 text-white py-6">
    <div class="container mx-auto px-4 text-center">
        <p>Asynchronous Class | Purposive Communication</p>
        <p class="text-sm opacity-60">Created by: Maniago, David, Alba, Balivia, Inventor</p>
    </div>
</footer>

<script>
    window.toggleLesson = toggleLesson;
    window.unlockAllLessons = unlockAllLessons;
    window.lockAllLessons = lockAllLessons;
    window.logout = logout;
    window.markCompleted = markCompleted;
</script>
</body>
</html>
