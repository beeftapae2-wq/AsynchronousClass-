<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Purposive Communication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Open Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card rounded-2xl shadow-2xl max-w-md w-full p-8 transition-all duration-300">
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full mb-3">
                <i data-lucide="message-square" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Purposive Communication</h1>
            <p class="text-gray-500 text-sm mt-1">Asynchronous Class Login</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" id="fullName" required 
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                           placeholder="e.g., Juan Dela Cruz">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Access Code</label>
                <div class="relative">
                    <i data-lucide="key" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="password" id="accessCode" required 
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                           placeholder="Enter access code">
                </div>
                <p class="text-xs text-gray-400 mt-1">Access code: purcom2026</p>
            </div>
            
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-2 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5"></i>
                <span>Enter Class</span>
            </button>
        </form>
        
        <p class="text-center text-xs text-gray-500 mt-6">
            Enter the access code provided by your instructor to join the class.
        </p>
    </div>
    
    <script>
        lucide.createIcons();
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const accessCode = document.getElementById('accessCode').value.trim();
            
            if (!fullName) {
                alert('Please enter your full name');
                return;
            }
            
            // Check access code
            if (accessCode !== 'purcom2026') {
                alert('Invalid access code. Please try again.');
                return;
            }
            
            // Store user session (role is always student)
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'student');
            localStorage.setItem('userName', fullName);
            
            // Initialize lesson access if not exists
            if (!localStorage.getItem('lessonAccess')) {
                const defaultAccess = {
                    lesson2: { unlocked: true, completed: false },
                    lesson3: { unlocked: false, completed: false },
                    lesson4: { unlocked: false, completed: false },
                    lesson5: { unlocked: false, completed: false },
                    lesson6: { unlocked: false, completed: false },
                    lesson7: { unlocked: false, completed: false },
                    lesson8: { unlocked: false, completed: false }
                };
                localStorage.setItem('lessonAccess', JSON.stringify(defaultAccess));
            }
            
            // Redirect to dashboard (index.html or dashboard.html - adjust if needed)
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
