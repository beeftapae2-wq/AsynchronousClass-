<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Purposive Communication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Open Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.95); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card rounded-2xl shadow-2xl max-w-md w-full p-8 transition-all duration-300">
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full mb-3">
                <i data-lucide="message-square" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Purposive Communication</h1>
            <p class="text-gray-500 text-sm mt-1">Asynchronous Class Login</p>
        </div>

        <div id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">WVSU ID Number</label>
                <div class="relative">
                    <i data-lucide="id-card" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="text" id="wvsuId" required
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                           placeholder="e.g., 2021-00123">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Access Code</label>
                <div class="relative">
                    <i data-lucide="key" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                    <input type="password" id="accessCode" required
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                           placeholder="Enter access code">
                </div>
                <p class="text-xs text-gray-400 mt-1">Student code: <strong>purcom2026</strong></p>
            </div>

            <button onclick="handleLogin()"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-2 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5"></i>
                <span>Enter Class</span>
            </button>
        </div>

        <p class="text-center text-xs text-gray-500 mt-6">
            Enter your WVSU ID number and the access code provided by your instructor.
        </p>
    </div>

    <script>
        lucide.createIcons();

        function handleLogin() {
            const wvsuId = document.getElementById('wvsuId').value.trim();
            const accessCode = document.getElementById('accessCode').value.trim();

            if (!wvsuId) {
                alert('Please enter your WVSU ID number.');
                return;
            }

            // Teacher login
            if (accessCode === 'teacher2026') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'teacher');
                localStorage.setItem('userName', wvsuId);
                // DON'T set lessonAccess here — index.html loads it from Firestore
                window.location.href = 'index.html';
                return;
            }

            // Student login
            if (accessCode === 'purcom2026') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'student');
                localStorage.setItem('userName', wvsuId);
                // DON'T set lessonAccess here — index.html loads it from Firestore
                window.location.href = 'index.html';
                return;
            }

            alert('Invalid access code. Please try again.');
        }

        // Allow pressing Enter to submit
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
